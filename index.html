<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111214">
  <meta name="description" content="停止輸入後，文字會逐漸隱入黑暗的專注寫作頁面。">
  <title>強制寫作</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23111214'/%3E%3Cpath d='M18 43 42 19l5 5-24 24H18z' fill='%23f3f0e8'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      font-family: "Noto Serif TC", "Source Han Serif TC", "PingFang TC", "Microsoft JhengHei", serif;
      background: #111214;
      color: #f3f0e8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111214;
    }

    body {
      min-height: 100dvh;
    }

    main {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 255, 255, .035), transparent 36rem),
        #111214;
    }

    .bar {
      position: absolute;
      z-index: 2;
      top: max(1rem, env(safe-area-inset-top));
      left: max(1.25rem, env(safe-area-inset-left));
      right: max(1.25rem, env(safe-area-inset-right));
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      pointer-events: none;
      color: #979891;
      font-family: system-ui, sans-serif;
      font-size: .8125rem;
      letter-spacing: .08em;
    }

    .title {
      color: #c8c6bf;
    }

    .status {
      min-width: 7em;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    textarea {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      resize: none;
      border: 0;
      outline: 0;
      padding:
        max(5.2rem, calc(env(safe-area-inset-top) + 4.2rem))
        max(7vw, calc(env(safe-area-inset-right) + 1.25rem))
        max(3rem, calc(env(safe-area-inset-bottom) + 2rem))
        max(7vw, calc(env(safe-area-inset-left) + 1.25rem));
      background: transparent;
      color: #f3f0e8;
      caret-color: #e3b86c;
      font: inherit;
      font-size: clamp(1.125rem, 1.4vw, 1.35rem);
      line-height: 1.95;
      letter-spacing: .035em;
      tab-size: 2;
    }

    textarea::placeholder {
      color: #686964;
    }

    .darkness {
      position: absolute;
      z-index: 3;
      inset: 0;
      pointer-events: none;
      background: #050506;
      opacity: 0;
      transition: opacity 7s linear;
    }

    body.fading .darkness {
      opacity: .995;
    }

    body.awake .darkness {
      opacity: 0;
      transition-duration: 120ms;
    }

    @media (max-width: 640px) {
      .bar {
        left: max(1rem, env(safe-area-inset-left));
        right: max(1rem, env(safe-area-inset-right));
      }

      textarea {
        padding:
          max(4.6rem, calc(env(safe-area-inset-top) + 3.7rem))
          max(1.25rem, calc(env(safe-area-inset-right) + 1.25rem))
          max(2rem, calc(env(safe-area-inset-bottom) + 1rem))
          max(1.25rem, calc(env(safe-area-inset-left) + 1.25rem));
        font-size: 1.0625rem;
        line-height: 1.85;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .darkness {
        transition-duration: 1s;
      }
    }
  </style>
</head>
<body class="awake">
  <main>
    <div class="bar" aria-hidden="true">
      <span class="title">強制寫作</span>
      <span class="status" id="status">0 字</span>
    </div>
    <textarea
      id="editor"
      aria-label="寫作區"
      autocomplete="off"
      autocapitalize="sentences"
      spellcheck="true"
      placeholder="開始寫。停下來，文字便會逐漸隱去。"
    ></textarea>
    <div class="darkness" aria-hidden="true"></div>
  </main>

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "forced-writing-draft-v1";
      var FADE_DELAY = 3000;
      var editor = document.getElementById("editor");
      var status = document.getElementById("status");
      var fadeTimer;

      function countCharacters(text) {
        return Array.from(text.replace(/\s/g, "")).length;
      }

      function updateStatus() {
        status.textContent = countCharacters(editor.value) + " 字";
      }

      function saveDraft() {
        try {
          localStorage.setItem(STORAGE_KEY, editor.value);
        } catch (error) {
          status.textContent = "無法儲存";
        }
      }

      function wake() {
        clearTimeout(fadeTimer);
        document.body.classList.remove("fading");
        document.body.classList.add("awake");

        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            document.body.classList.remove("awake");
          });
        });

        fadeTimer = window.setTimeout(function () {
          document.body.classList.add("fading");
        }, FADE_DELAY);
      }

      function restoreDraft() {
        try {
          var saved = localStorage.getItem(STORAGE_KEY);
          if (saved !== null) {
            editor.value = saved;
          }
        } catch (error) {
          status.textContent = "無法讀取草稿";
        }
      }

      editor.addEventListener("input", function () {
        wake();
        updateStatus();
        saveDraft();
      });

      editor.addEventListener("compositionupdate", wake);
      editor.addEventListener("paste", wake);
      editor.addEventListener("drop", wake);

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          saveDraft();
        } else {
          wake();
        }
      });

      window.addEventListener("pagehide", saveDraft);

      restoreDraft();
      updateStatus();
      wake();
      editor.focus({ preventScroll: true });
    }());
  </script>
</body>
</html>
